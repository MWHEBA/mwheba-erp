{% load i18n %}
<div class="sub-section mb-4" id="giveaways_section" style="display: none;">
  <h6 class="sub-section-title text-primary mb-3">
    <i class="fas fa-gift me-2"></i>{% trans "الهدايا الدعائية والمنتجات الترويجية وشيتات الكريستال" %}
  </h6>

  <div class="card mb-3 border-0 bg-light">
    <div class="card-body p-3">
      <div class="row g-3">
        <!-- صنف الهدية -->
        <div class="col-md-4">
          <label class="form-label fw-bold">{% trans "صنف الهدية / الخامة" %}</label>
          <select class="form-select" id="id_giveaway_item" name="giveaway_item">
            <option value="pen_metal">{% trans "قلم معدن ليزر فاخر" %}</option>
            <option value="pen_plastic">{% trans "قلم بلاستيك ترويجي" %}</option>
            <option value="mug_ceramic">{% trans "مج سيراميك أبيض (Sublimation)" %}</option>
            <option value="mug_magic">{% trans "مج سحري حراري" %}</option>
            <option value="flash_usb">{% trans "فلاش ميموري USB كارت/معدن" %}</option>
            <option value="powerbank">{% trans "باور بنك مطبوع 10,000mAh" %}</option>
            <option value="medal_metal">{% trans "ميدالية معدن كريستال" %}</option>
            <option value="notebook_agenda">{% trans "أجندة جلدية سنوية" %}</option>
            <option value="uv_dtf_meter">{% trans "شيت ستيكر كريستال بارز UV-DTF (بالمتر)" %}</option>
          </select>
        </div>

        <!-- سعر خامة القطعة -->
        <div class="col-md-4">
          <label class="form-label fw-bold">{% trans "سعر خامة القطعة / الشيت (ج)" %}</label>
          <input type="number" step="0.01" class="form-control" id="id_giveaway_blank_cost" name="giveaway_blank_cost" value="25.00">
        </div>

        <!-- فتحة الماكينة ومصنعية الطباعة -->
        <div class="col-md-4">
          <label class="form-label fw-bold">{% trans "فتحة الماكينة وتكلفة الطباعة (ج)" %}</label>
          <input type="number" step="0.01" class="form-control" id="id_giveaway_print_cost" name="giveaway_print_cost" value="150.00">
        </div>
      </div>

      <!-- صمامات واحتياطات الهدايا والإلكترونيات -->
      <div class="row g-3 mt-2">
        <div class="col-md-6">
          <div class="form-check p-3 bg-white rounded border">
            <input class="form-check-input ms-2" type="checkbox" id="electronics_check_buffer" checked>
            <label class="form-check-label fw-bold text-dark" for="electronics_check_buffer">
              <i class="fas fa-microchip text-danger me-1"></i>{% trans "احتياطي فحص الإلكترونيات (3% Safety Buffer)" %}
            </label>
            <div class="small text-muted mt-1">
              {% trans "يضاف تلقائياً لتغطية أي وحدات إلكترونية تالفة من المورد عند فحص الفلاشات أو الباور بنك." %}
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-check p-3 bg-white rounded border">
            <input class="form-check-input ms-2" type="checkbox" id="customer_supplied_material">
            <label class="form-check-label fw-bold text-dark" for="customer_supplied_material">
              <i class="fas fa-hand-holding text-success me-1"></i>{% trans "الخامات موردة من العميل (طباعة فقط)" %}
            </label>
            <div class="small text-muted mt-1">
              {% trans "تطبيق إقرار نسبة هالك التشغيل 2-3% وإسقاط تكلفة الخامات الفارغة من الحسبة." %}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
