{% load i18n %}
{% load app_tags %}

<div class="section-container mb-4" id="card_step5_logistics">
  <!-- Section Title & Accordion Trigger -->
  <h5 class="section-title cursor-pointer" data-bs-toggle="collapse" data-bs-target="#collapse_step5" aria-expanded="true">
    <span>
      <i class="fas fa-truck text-warning me-2"></i>
      <span id="step5_header_title">5. {% trans "اللوجستيات والشحن والتسليم والتعبئة" %}</span>
    </span>
    <span class="badge bg-warning-subtle text-dark border border-warning-subtle px-3 py-1 ms-auto me-2" id="step5_badge_status">
      <i class="fas fa-box-open me-1"></i>{% trans "شحن وتعبئة" %}
    </span>
    <i class="fas fa-chevron-down"></i>
  </h5>

  <!-- Accordion Body -->
  <div id="collapse_step5" class="collapse show">
    <div>
      <div class="row g-3 mb-4 pb-3 border-bottom">
        <!-- 1. شروط ومكان التسليم -->
        <div class="col-md-4">
          <label for="id_delivery_terms" class="form-label fw-bold">
            <i class="fas fa-map-marker-alt text-danger me-1"></i>{% trans "شروط ومكان التسليم" %}
          </label>
          <select class="form-select select2-filter" id="id_delivery_terms" name="delivery_terms">
            <option value="ex_factory" selected>{% trans "تسليم أرض المطبعة / المخزن (بدون تكلفة نقل)" %}</option>
            <option value="delivery_cairo">{% trans "توصيل لمقر العميل داخل القاهرة والجيزة" %}</option>
            <option value="shipping_governorates">{% trans "شحن محافظات بنولون شحن" %}</option>
          </select>
        </div>

        <!-- 2. تقدير تكلفة الشحن (تقديري للموظف) -->
        <div class="col-md-4">
          <label for="id_extra_cost" class="form-label fw-bold">
            {% trans "تقدير تكلفة الشحن والنقل" %} ({{ currency_symbol|default:"ج.م" }})
          </label>
          <input type="number" step="10" class="form-control fw-bold text-primary" id="id_extra_cost" name="extra_cost" 
                 value="{{ form.extra_cost.value|default:form.instance.extra_cost|default:'0.00' }}">
          <div class="form-text small">{% trans "تقدير يدوي مرن حسب المسافة ووسيلة النقل." %}</div>
        </div>

        <!-- 3. موعد التسليم المستهدف -->
        <div class="col-md-4">
          <label for="id_due_date" class="form-label fw-bold">
            <i class="fas fa-calendar-alt text-primary me-1"></i>{% trans "موعد التسليم المستهدف" %}
          </label>
          <input type="date" class="form-control" id="id_due_date" name="due_date" 
                 value="{{ form.due_date.value|date:'Y-m-d'|default:form.instance.due_date|date:'Y-m-d'|default:'' }}">
        </div>
      </div>

      <!-- 4. ملاحظات التعبئة والتغليف وشرط التفاوت -->
      <div class="row g-3">
        <div class="col-md-8">
          <label for="id_description" class="form-label fw-bold small text-muted">
            <i class="fas fa-box me-1"></i>{% trans "تعليمات وملاحظات التعبئة والتغليف والطلب" %}
          </label>
          <textarea class="form-control" id="id_description" name="description" rows="2" 
                    placeholder="{% trans "مثال: التعبئة في كراتين تصدير قوية مع وضع ملصق العميل برقم الصنف..." %}">{{ form.description.value|default:form.instance.description|default:'' }}</textarea>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold small text-muted">{% trans "الشروط التعاقدية للطباعة" %}</label>
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="id_tolerance_allowed" name="tolerance_allowed" checked>
            <label class="form-check-label small fw-bold text-dark" for="id_tolerance_allowed">
              {% trans "تطبيق شرط التفاوت المعتمد (+/- 5%) والفوترة على الصافي المسلم" %}
            </label>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
