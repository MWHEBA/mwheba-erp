{% load i18n %}
<div class="presets-container mb-4 p-3 bg-light rounded border">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <span class="fw-bold text-dark fs-6">
      <i class="fas fa-magic text-primary me-2"></i>{% trans "قوالب سريعة بنقرة واحدة (1-Click Presets):" %}
    </span>
    <span class="text-muted small">{% trans "اختر قالباً جاهزاً لملء المواصفات الفنية فوراً" %}</span>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="business_card">
      <i class="fas fa-id-card text-primary me-1"></i>{% trans "كارت شخصي فاخر" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="flyer_a4">
      <i class="fas fa-file-alt text-success me-1"></i>{% trans "فلاير دعائي A4" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="flyer_a5">
      <i class="fas fa-file text-info me-1"></i>{% trans "فلاير مقاس A5" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="brochure_trifold">
      <i class="fas fa-columns text-warning me-1"></i>{% trans "بروشور 3 طيات" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="catalog_64p">
      <i class="fas fa-book-open text-danger me-1"></i>{% trans "كتالوج 64 صفحة" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="folder_pocket">
      <i class="fas fa-folder text-primary me-1"></i>{% trans "فولدر شركات بجيب" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="ncr_invoice">
      <i class="fas fa-receipt text-secondary me-1"></i>{% trans "دفاتر فواتير NCR" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="giveaways_pen_mug">
      <i class="fas fa-gift text-success me-1"></i>{% trans "هدايا (أقلام / مجات)" %}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-preset="uv_dtf_sheet">
      <i class="fas fa-gem text-info me-1"></i>{% trans "ستيكر كريستال UV-DTF" %}
    </button>
  </div>
</div>
