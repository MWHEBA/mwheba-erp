{% load i18n %}
<!-- نافذة بوابة فحص مراقبة الجودة الرقمية (QC Sign-off Modal) -->
<div class="modal fade" id="qcSignoffModal" tabindex="-1" aria-labelledby="qcSignoffModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0" id="qcSignoffModalLabel">
          <i class="fas fa-microscope text-primary me-2"></i>{% trans "بوابة فحص ومراقبة الجودة الرقمية (QC)" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="qcSignoffForm" method="post" action="{% url 'printing_pricing:api_qc_signoff' order.pk %}">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold">{% trans "اسم مسؤول فحص الجودة" %} <span class="text-danger">*</span></label>
              <input type="text" name="inspector_name" class="form-control" value="{{ request.user.get_full_name|default:request.user.username }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">{% trans "الكمية الصافية المعتمدة للتسليم" %} <span class="text-danger">*</span></label>
              <input type="number" name="net_quantity_approved" class="form-control" value="{{ order.quantity }}" min="1" required>
            </div>
          </div>

          <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="fas fa-tasks text-secondary me-2"></i>{% trans "قائمة التحقق الفنية الرقمية (QC Checklist)" %}</h6>
          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <div class="form-check p-2 bg-light rounded border">
                <input class="form-check-input ms-2" type="checkbox" name="bleed_verified" id="chkBleed" checked>
                <label class="form-check-label fw-semibold" for="chkBleed">{% trans "مسافة الخروج (Bleed 3mm) والقص سليم" %}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check p-2 bg-light rounded border">
                <input class="form-check-input ms-2" type="checkbox" name="barcode_scannable" id="chkBarcode" checked>
                <label class="form-check-label fw-semibold" for="chkBarcode">{% trans "فحص قراءة الباركود والـ QR بالماسح" %}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check p-2 bg-light rounded border">
                <input class="form-check-input ms-2" type="checkbox" name="color_registration_passed" id="chkColor" checked>
                <label class="form-check-label fw-semibold" for="chkColor">{% trans "تطابق الألوان الأوفست (Registration)" %}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check p-2 bg-light rounded border">
                <input class="form-check-input ms-2" type="checkbox" name="physical_swatch_matched" id="chkSwatch">
                <label class="form-check-label fw-semibold" for="chkSwatch">{% trans "مطابقة عينة الألوان المادية المرفقة" %}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check p-2 bg-light rounded border">
                <input class="form-check-input ms-2" type="checkbox" name="lamination_adhesion_passed" id="chkLam" checked>
                <label class="form-check-label fw-semibold" for="chkLam">{% trans "ثبات وقوة التصاق السلوفان" %}</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check p-2 bg-light rounded border">
                <input class="form-check-input ms-2" type="checkbox" name="ncr_sequence_verified" id="chkNCR" checked>
                <label class="form-check-label fw-semibold" for="chkNCR">{% trans "تسلسل وترتيب فواتير NCR" %}</label>
              </div>
            </div>
          </div>

          <div class="p-3 bg-light rounded border mb-3">
            <div class="form-check mb-2">
              <input class="form-check-input ms-2" type="checkbox" name="sample_vault_archived" id="chkVault" checked>
              <label class="form-check-label fw-bold text-dark" for="chkVault">
                {% trans "تم تحريز 5-10 عينات في خزانة الجودة لمدة 90 يوماً كحرز قانوني" %}
              </label>
            </div>
            <input type="text" name="sample_vault_ref" class="form-control form-control-sm" placeholder="{% trans 'رقم حرز خزانة العينات (تلقائي إن ترك فارغاً)' %}">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "ملاحظات تقرير الجودة" %}</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="{% trans 'أي ملاحظات فنية أو استثناءات...' %}"></textarea>
          </div>
        </div>

        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-primary px-4 fw-bold">
            <i class="fas fa-check-circle me-1"></i> {% trans "اعتماد تقرير الجودة QC" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
