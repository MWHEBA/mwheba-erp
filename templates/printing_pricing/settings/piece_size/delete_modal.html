{% load i18n %}
<!-- هيدر المودال الفاتح الموحد طبقاً للبند 8 -->
<div class="modal-header bg-light border-bottom px-4 py-3">
    <h5 class="modal-title fw-bold text-dark mb-0">
        <i class="fas fa-exclamation-triangle text-danger me-2"></i>
        {% trans "تأكيد حذف مقاس القطع" %}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'إغلاق' %}"></button>
</div>

<form method="post" action="{{ action_url }}" onsubmit="event.preventDefault(); return SettingsCRUD.submitDelete('{{ action_url }}', this, document.getElementById('deleteModal'));">
    <div class="modal-body p-4">
        {% csrf_token %}
        <p class="text-secondary mb-2">{% trans "هل أنت متأكد من رغبتك في حذف مقاس القطع التالي؟" %}</p>
        <div class="alert alert-light border py-2 px-3 fw-bold text-dark">
            <i class="fas fa-cut text-primary me-2"></i>
            {{ object.name }} ({{ object.width }}×{{ object.height }} سم)
        </div>
        <small class="text-danger d-block mt-2">
            <i class="fas fa-info-circle me-1"></i>
            {% trans "تحذير: لا يمكن حذف المقاس إذا كان مرتبطاً بأوامر تسعير أو منتجات مسجلة." %}
        </small>
    </div>
    
    <div class="modal-footer bg-light border-top px-4 py-3">
        <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">
            {% trans "إلغاء" %}
        </button>
        <button type="submit" class="btn btn-danger px-4 fw-bold">
            <i class="fas fa-trash-alt me-1"></i> {% trans "تأكيد الحذف" %}
        </button>
    </div>
</form>
