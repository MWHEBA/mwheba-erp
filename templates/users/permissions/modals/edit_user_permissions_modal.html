<!-- Modal تعديل الصلاحيات المخصصة للمستخدم -->
<div class="modal fade" id="editUserPermissionsModal" tabindex="-1" aria-labelledby="editUserPermissionsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light border-bottom px-4 py-3">
                <h5 class="modal-title fw-bold text-dark mb-0" id="editUserPermissionsModalLabel">
                    <i class="fas fa-user-edit text-primary me-2"></i>تعديل الصلاحيات المخصصة للمستخدم: <span id="editUserPermsName" class="text-primary"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="editUserPermsUserId" value="">
                
                <div class="alert alert-info py-2 px-3 mb-3 small d-flex justify-content-between align-items-center">
                    <div>
                        <i class="fas fa-info-circle me-1"></i>
                        الصلاحيات المحددة هنا تُمنح للمستخدم بالإضافة إلى صلاحيات دوره الأساسي وأدواره الثانوية.
                    </div>
                    <div class="d-flex gap-2">
                        <span class="badge bg-light text-secondary border px-2 py-1">
                            <i class="fas fa-lock me-1"></i>موروثة
                        </span>
                        <span class="badge bg-primary text-white px-2 py-1">
                            <i class="fas fa-plus me-1"></i>إضافية
                        </span>
                        <span class="badge bg-danger text-white px-2 py-1">
                            <i class="fas fa-ban me-1"></i>محجوبة
                        </span>
                    </div>
                </div>

                <!-- Live Permission Search Bar -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" class="form-control perm-search-input" placeholder="بحث فوري في الصلاحيات (بالاسم العربي أو الكود التقني)...">
                        <button class="btn btn-outline-secondary clear-perm-search-btn" type="button" style="display:none;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <div class="permissions-container">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary me-2"></div>
                        جاري التحميل...
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light border-top px-4 py-3">
                <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary px-4 fw-bold" id="saveUserPermsBtn">
                    <i class="fas fa-save me-2"></i>حفظ التغييرات
                </button>
            </div>
        </div>
    </div>
</div>
