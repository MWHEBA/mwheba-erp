<!-- Modal تعديل الصلاحيات المخصصة للمستخدم -->
<div class="modal fade" id="editUserPermissionsModal" tabindex="-1" aria-labelledby="editUserPermissionsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light border-bottom px-4 py-3">
                <h5 class="modal-title fw-bold text-dark mb-0" id="editUserPermissionsModalLabel">
                    <i class="fas fa-user-edit text-primary me-2"></i>تعديل الصلاحيات المخصصة للمستخدم
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body p-4">
                <!-- سيتم ملء المحتوى هنا بواسطة JavaScript -->
                <div class="text-center py-4">
                    <div class="spinner-border text-primary me-2"></div>
                    جاري التحميل...
                </div>
            </div>
            <div class="modal-footer bg-light border-top px-4 py-3">
                <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary px-4 fw-bold" onclick="saveUserPermissions()">
                    <i class="fas fa-save me-2"></i>حفظ التغييرات
                </button>
            </div>
        </div>
    </div>
</div>
