<!-- Modal تعديل دور -->
<div class="modal fade" id="editRoleModal" tabindex="-1" aria-labelledby="editRoleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light border-bottom px-4 py-3">
                <h5 class="modal-title fw-bold text-dark mb-0" id="editRoleModalLabel">
                    <i class="fas fa-edit text-primary me-2"></i>تعديل الدور
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <form id="editRoleForm">
                <input type="hidden" id="editRoleId" name="role_id">
                <div class="modal-body p-4">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="editRoleName" class="form-label">اسم الدور <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="editRoleName" name="name" required readonly>
                                <div class="form-text">لا يمكن تغيير اسم الدور</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="editRoleDisplayName" class="form-label">الاسم المعروض <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="editRoleDisplayName" name="display_name" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="editRoleDescription" class="form-label">الوصف</label>
                        <textarea class="form-control" id="editRoleDescription" name="description" rows="3"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="editRoleParent" class="form-label">الدور الأب (وراثة الصلاحيات)</label>
                                <select class="form-select select2-filter" id="editRoleParent" name="parent_role_id" dir="rtl" style="width: 100%;">
                                    <option value="">بدون دور أب (دور مستقل)</option>
                                    {% for role in available_roles %}
                                    <option value="{{ role.id }}">{{ role.display_name }}</option>
                                    {% endfor %}
                                </select>
                                <div class="form-text">يرث هذا الدور كافة صلاحيات الدور الأب تلقائياً</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label d-block">&nbsp;</label>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="editRoleActive" name="is_active">
                                    <label class="form-check-label" for="editRoleActive">
                                        دور نشط
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <hr>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0 fw-bold">الصلاحيات</h6>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-outline-primary select-all-modal-btn">
                                    <i class="fas fa-check-double me-1"></i>تحديد الكل
                                </button>
                                <button type="button" class="btn btn-outline-secondary clear-all-modal-btn">
                                    <i class="fas fa-times me-1"></i>إلغاء الكل
                                </button>
                            </div>
                        </div>

                        <!-- Live Permission Search Bar -->
                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text bg-light"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" class="form-control perm-search-input" placeholder="تصفية الصلاحيات فورياً (بالاسم أو الكود)...">
                        </div>
                        <div class="permissions-container" style="max-height: 350px; overflow-y: auto; border: 1px solid var(--bs-border-color); border-radius: 8px;">
                            <div class="text-center py-4">
                                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                جاري تحميل الصلاحيات...
                            </div>
                        </div>
                        <div class="mt-2">
                            <small class="text-muted">
                                <i class="fas fa-info-circle me-1"></i>
                                يمكنك النقر على اسم التطبيق لتحديد/إلغاء تحديد جميع صلاحياته
                            </small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-top px-4 py-3">
                    <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">إلغاء</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold" id="editRoleBtn">
                        <span class="btn-text">
                            <i class="fas fa-save me-1"></i>حفظ التغييرات
                        </span>
                        <span class="btn-loading d-none">
                            <i class="fas fa-spinner fa-spin me-1"></i>جاري الحفظ...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
