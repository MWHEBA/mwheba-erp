{% load i18n %}
{% if object.purchase %}
  <a href="{% url 'purchase:purchase_detail' object.purchase.id %}" class="text-primary text-decoration-none fw-bold text-nowrap">
    <i class="fas fa-shopping-cart me-1"></i><span class="text-nowrap" style="white-space: nowrap !important;">{{ object.purchase.number }}</span>
  </a>
{% elif object.sale %}
  <a href="{% url 'sale:sale_detail' object.sale.id %}" class="text-success text-decoration-none fw-bold text-nowrap">
    <i class="fas fa-file-invoice-dollar me-1"></i><span class="text-nowrap" style="white-space: nowrap !important;">{{ object.sale.number }}</span>
  </a>
{% elif value %}
  <span class="text-secondary fw-bold text-nowrap" style="white-space: nowrap !important;">
    <i class="fas fa-file-alt me-1"></i><span class="text-nowrap" style="white-space: nowrap !important;">{{ value }}</span>
  </span>
{% else %}
  <span class="text-muted">-</span>
{% endif %}
