{% if object.status == 'absent' or object.status == 'on_leave' %}
    <span class="text-muted">-</span>
{% elif object.check_out %}
    <span class="badge bg-info">{{ object.check_out|date:"g:i A" }}</span>
{% elif object.check_in %}
    <span class="badge bg-warning text-dark" title="حضر ولكن لم يسجل بصمة انصراف">لم ينصرف</span>
{% else %}
    <span class="text-muted">-</span>
{% endif %}
