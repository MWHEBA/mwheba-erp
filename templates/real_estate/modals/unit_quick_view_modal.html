{% load i18n %}

<div class="modal fade" id="unitQuickViewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0">
          <i class="fas fa-home text-primary me-2"></i>{% trans "بطاقة المعاينة السريعة للوحدة العقارية" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4" id="unitQuickViewBody">
        <div class="text-center py-4">
          <div class="spinner-border text-primary" role="status"></div>
          <div class="mt-2 text-muted small">{% trans "جاري تحميل تفاصيل الوحدة..." %}</div>
        </div>
      </div>
      <div class="modal-footer bg-light border-top px-4 py-3" id="unitQuickViewFooter">
        <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إغلاق" %}</button>
      </div>
    </div>
  </div>
</div>
