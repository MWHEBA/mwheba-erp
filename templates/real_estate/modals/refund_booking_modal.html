{% load i18n %}

<div class="modal fade" id="refundBookingModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0">
          <i class="fas fa-hand-holding-usd text-primary me-2"></i>{% trans "إثبات صرف استرداد أمانة الحجز" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="refund-booking-form" method="post">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label small text-muted">{% trans "مبلغ الأمانة المسترد للعميل" %}</label>
            <div class="fs-4 fw-bold text-success font-monospace">
              {{ booking.holding_deposit|default:"0.00" }} {{ booking.deposit_currency.code|default:"EGP" }}
            </div>
          </div>

          <div class="mb-3">
            <label for="refund_account" class="form-label fw-semibold text-dark">
              {% trans "حساب الصرف (الخزينة / البنك)" %} <span class="text-danger">*</span>
            </label>
            <select name="refund_account" id="refund_account" class="form-select select2-modal" dir="rtl" required>
              <option value="">{% trans "اختر الحساب المصروف منه..." %}</option>
              {% for acc in payment_accounts %}
              <option value="{{ acc.id }}">{{ acc.code }} - {{ acc.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="refund_notes" class="form-label text-dark">{% trans "ملاحظات سند الصرف" %}</label>
            <input type="text" name="notes" id="refund_notes" class="form-control" placeholder="{% trans 'ملاحظات إضافية على عملية الصرف...' %}">
          </div>
        </div>
        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-primary px-4 fw-bold">
            <i class="fas fa-check me-1"></i>{% trans "ترحيل سند الصرف والقيد" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
