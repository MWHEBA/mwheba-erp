{% load i18n %}

<div class="modal fade" id="installmentRescheduleModal" tabindex="-1" aria-labelledby="installmentRescheduleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0" id="installmentRescheduleModalLabel">
          <i class="fas fa-calendar-alt text-info me-2"></i>{% trans "جدولة دفعات المستخلص على أقساط مؤرخة" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="" method="post" id="installmentRescheduleForm">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "رقم القسط" %}</label>
            <input type="number" name="installment_number" class="form-control" value="1" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "مبلغ القسط المجدول" %}</label>
            <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "تاريخ استحقاق الدفعة" %}</label>
            <input type="date" name="due_date" class="form-control" required>
          </div>
          <div class="mb-0">
            <label class="form-label fw-bold">{% trans "ملاحظات الجدولة" %}</label>
            <textarea name="notes" rows="2" class="form-control"></textarea>
          </div>
        </div>
        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-info text-dark px-4 fw-bold">
            <i class="fas fa-calendar-check me-1"></i>{% trans "حفظ القسط المجدول" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
