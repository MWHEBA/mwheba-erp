{% load i18n %}

<div class="modal fade" id="backchargeModal" tabindex="-1" aria-labelledby="backchargeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0" id="backchargeModalLabel">
          <i class="fas fa-exclamation-triangle text-warning me-2"></i>{% trans "تسجيل خصم بيني على مقاول الباطن (Backcharge)" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="" method="post" id="backchargeForm">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "رقم المذكرة / المرجع" %}</label>
            <input type="text" name="memo_reference" class="form-control" placeholder="BC-2026-001" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "قيمة الخصم المالي" %}</label>
            <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "المقاول المستفيد من الخصم (إن وجد)" %}</label>
            <select name="beneficiary_contractor" class="form-select select2-filter" dir="rtl">
              <option value="">{% trans "خصم مباشر لصالح الشركة" %}</option>
              {% for c in contractors %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-0">
            <label class="form-label fw-bold">{% trans "سبب الخصم والمبرر الهندسي" %}</label>
            <textarea name="reason" rows="3" class="form-control" placeholder="{% trans 'تلفيات بند تشطيب، إصلاح عيوب، نظافة...' %}" required></textarea>
          </div>
        </div>
        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-danger px-4 fw-bold">
            <i class="fas fa-check-circle me-1"></i>{% trans "تأكيد تسجيل الخصم" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
