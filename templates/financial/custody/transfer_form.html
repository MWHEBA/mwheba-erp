{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header المركزي الموحد -->
    {% include "shared/page_header.html" %}

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="section-container mb-4">
                <h5 class="section-title mb-4">
                    <i class="fas fa-exchange-alt me-2 text-primary"></i>بيانات سند مناقلة العهدة
                </h5>

                <form method="POST">
                    {% csrf_token %}

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">الموظف المُسلِّم (المحول منه) <span class="text-danger">*</span></label>
                            <select name="from_employee_id" class="form-select select2-filter" required>
                                <option value="">-- اختر الموظف المُسلِّم --</option>
                                {% for emp in employees %}
                                    <option value="{{ emp.id }}">{{ emp.name }} ({{ emp.employee_number }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">الموظف المُستلِم (المحول إليه) <span class="text-danger">*</span></label>
                            <select name="to_employee_id" class="form-select select2-filter" required>
                                <option value="">-- اختر الموظف المُستلِم --</option>
                                {% for emp in employees %}
                                    <option value="{{ emp.id }}">{{ emp.name }} ({{ emp.employee_number }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">المبلغ المحول <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" name="amount" step="0.01" min="0.01" class="form-control" required placeholder="0.00">
                            <span class="input-group-text bg-light">ج.م</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">سبب المناقلة وتفاصيل محضر التسليم والتسلم</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="بيان سبب نقل العهدة وتوقيعات الطرفين بالموقع..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a href="{% url 'financial:custody_transfer_list' %}" class="btn btn-secondary px-4">إلغاء</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold">
                            <i class="fas fa-check-circle me-1"></i>اعتماد وترحيل المناقلة
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    if ($.fn.select2) {
        $('.select2-filter').select2({
            dir: 'rtl',
            language: 'ar',
            width: '100%'
        });
    }
});
</script>
{% endblock %}
