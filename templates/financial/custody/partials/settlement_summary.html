{% load pricing_filters %}

<div class="row g-3 mb-4">
    <div class="col-xl-6 col-md-6">
        <div class="stats-card stats-card-success h-100 shadow-sm border-0">
            <div class="stats-card-body d-flex align-items-center justify-content-between p-3">
                <div>
                    <div class="stats-card-title text-muted fs-7 mb-1">إجمالي التسويات المرحلة محاسبياً</div>
                    <div class="stats-card-value fs-4 fw-bold text-success">{{ total_posted_settlements|smart_float }} <span class="fs-6 text-muted">ج.م</span></div>
                </div>
                <div class="stats-card-icon bg-light text-success p-3 rounded-circle">
                    <i class="fas fa-check-double fa-2x"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-6 col-md-6">
        <div class="stats-card stats-card-warning h-100 shadow-sm border-0">
            <div class="stats-card-body d-flex align-items-center justify-content-between p-3">
                <div>
                    <div class="stats-card-title text-muted fs-7 mb-1">تسويات بانتظار الاعتماد والمراجعة</div>
                    <div class="stats-card-value fs-4 fw-bold text-warning">{{ pending_count }} <span class="fs-7 text-muted">سند قيد المراجعة</span></div>
                </div>
                <div class="stats-card-icon bg-light text-warning p-3 rounded-circle">
                    <i class="fas fa-clock fa-2x"></i>
                </div>
            </div>
        </div>
    </div>
</div>
