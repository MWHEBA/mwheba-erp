{% load i18n %}

<div class="modal fade" id="settleChequeModal" tabindex="-1" aria-labelledby="settleChequeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0" id="settleChequeModalLabel">
          <i class="fas fa-money-check-alt text-success me-2"></i>{% trans "إصدار شيك بنكي آجل (PDC) لسداد دفعة المستخلص" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="" method="post" id="settleChequeForm">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="alert alert-info small mb-3">
            <i class="fas fa-info-circle me-1"></i>
            {% trans "يتم إنشاء ورقة دفع بنكية آجلة (حساب 21210) وإقفال رصيد دفعة المستخلص الجاري." %}
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "رقم الشيك البنكي" %} <span class="text-danger">*</span></label>
            <input type="text" name="cheque_number" class="form-control" placeholder="CHQ-100200" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-bold">{% trans "تاريخ استحقاق الشيك" %} <span class="text-danger">*</span></label>
              <input type="date" name="cheque_due_date" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-bold">{% trans "قيمة الشيك" %} <span class="text-danger">*</span></label>
              <input type="number" step="0.01" name="amount" id="cheque_amount_input" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{% trans "البنك المسحوب عليه" %} <span class="text-danger">*</span></label>
            <input type="text" name="bank_name" class="form-control" placeholder="{% trans 'البنك التجاري الدولي CIB' %}" required>
          </div>
          <div class="mb-0">
            <label class="form-label fw-bold">{% trans "ملاحظات تحرير الشيك" %}</label>
            <textarea name="notes" rows="2" class="form-control"></textarea>
          </div>
        </div>
        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-success px-4 fw-bold">
            <i class="fas fa-check-circle me-1"></i>{% trans "تأكيد إصدار الشيك" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
