{% load i18n %}

<div class="modal fade" id="tierModal" tabindex="-1" aria-labelledby="tierModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-dark mb-0" id="tierModalLabel">
          <i class="fas fa-layer-group text-primary me-2"></i><span id="tierModalTitleText">{% trans "إضافة شريحة تجارية" %}</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="tierForm" method="POST" action="{% url 'customer:tier_create' %}" novalidate>
        {% csrf_token %}
        <div class="modal-body p-4">
          <div id="tierFormAlert" class="alert alert-danger d-none"></div>

          <div class="row g-3">
            <!-- اسم الشريحة -->
            <div class="col-md-6">
              <label for="id_tier_name" class="form-label fw-bold">{% trans "اسم الشريحة" %} <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="id_tier_name" name="name" required placeholder="مثال: شركات كبرى، تجار جملة">
              <div class="invalid-feedback" id="error_name"></div>
            </div>

            <!-- الكود -->
            <div class="col-md-3">
              <label for="id_tier_code" class="form-label fw-bold">{% trans "كود الشريحة" %} <span class="text-danger">*</span></label>
              <input type="text" class="form-control font-monospace text-uppercase" id="id_tier_code" name="code" required placeholder="CORP">
              <div class="invalid-feedback" id="error_code"></div>
            </div>

            <!-- ترتيب العرض -->
            <div class="col-md-3">
              <label for="id_tier_display_order" class="form-label fw-bold">{% trans "ترتيب العرض" %}</label>
              <input type="number" class="form-control" id="id_tier_display_order" name="display_order" value="0" min="0">
              <div class="invalid-feedback" id="error_display_order"></div>
            </div>

            <!-- الوصف -->
            <div class="col-12">
              <label for="id_tier_description" class="form-label">{% trans "الوصف" %}</label>
              <textarea class="form-control" id="id_tier_description" name="description" rows="2" placeholder="وصف موجز لطبيعة هذه الشريحة ومعايير إسناد العملاء إليها..."></textarea>
              <div class="invalid-feedback" id="error_description"></div>
            </div>

            <div class="col-12"><hr class="my-2 text-muted opacity-25"></div>
            <div class="col-12"><h6 class="fw-bold text-secondary mb-0"><i class="fas fa-sliders-h me-2"></i>{% trans "السياسات المالية والائتمانية الافتراضية" %}</h6></div>

            <!-- قائمة الأسعار الافتراضية -->
            <div class="col-md-6">
              <label for="id_tier_default_price_list" class="form-label">{% trans "قائمة الأسعار الافتراضية" %}</label>
              <select class="form-select select2-modal" id="id_tier_default_price_list" name="default_price_list">
                <option value="">{% trans "بدون قائمة (الأسعار القياسية)" %}</option>
                <!-- يتم التعبئة ديناميكياً أو عبر السيرفر -->
              </select>
              <small class="text-muted">{% trans "قائمة الأسعار المطبقة تلقائياً عند إنشاء فواتير لعملاء هذه الشريحة" %}</small>
              <div class="invalid-feedback" id="error_default_price_list"></div>
            </div>

            <!-- نسبة الخصم الإضافية -->
            <div class="col-md-6">
              <label for="id_tier_discount_percentage" class="form-label">{% trans "نسبة الخصم الافتراضية (%)" %}</label>
              <div class="input-group">
                <input type="number" class="form-control" id="id_tier_discount_percentage" name="discount_percentage" value="0.00" step="0.01" min="0" max="100">
                <span class="input-group-text">%</span>
              </div>
              <small class="text-muted">{% trans "تطبق كخصم شريحة تلقائي في عروض الأسعار والفواتير" %}</small>
              <div class="invalid-feedback" id="error_discount_percentage"></div>
            </div>

            <!-- شرط السداد الافتراضي -->
            <div class="col-md-4">
              <label for="id_tier_default_payment_term" class="form-label">{% trans "شرط السداد الافتراضي" %}</label>
              <select class="form-select select2-modal" id="id_tier_default_payment_term" name="default_payment_term">
                <option value="">{% trans "بدون شرط افتراضي" %}</option>
                {% for pt in payment_terms %}
                <option value="{{ pt.pk }}">{{ pt.name }} ({{ pt.days }} {% trans "يوم" %})</option>
                {% endfor %}
              </select>
              <div class="invalid-feedback" id="error_default_payment_term"></div>
            </div>

            <!-- الحد الائتماني الافتراضي -->
            <div class="col-md-4">
              <label for="id_tier_default_credit_limit" class="form-label">{% trans "الحد الائتماني الافتراضي" %}</label>
              <input type="number" class="form-control" id="id_tier_default_credit_limit" name="default_credit_limit" value="0.00" step="0.01" min="0">
              <div class="invalid-feedback" id="error_default_credit_limit"></div>
            </div>

            <!-- درجة المخاطرة -->
            <div class="col-md-4">
              <label for="id_tier_default_risk_category" class="form-label">{% trans "تصنيف المخاطرة" %}</label>
              <select class="form-select" id="id_tier_default_risk_category" name="default_risk_category">
                <option value="low">{% trans "منخفضة (Low)" %}</option>
                <option value="medium" selected>{% trans "متوسطة (Medium)" %}</option>
                <option value="high">{% trans "مرتفعة (High)" %}</option>
              </select>
              <div class="invalid-feedback" id="error_default_risk_category"></div>
            </div>

            <!-- الحالة -->
            <div class="col-12 mt-3">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="id_tier_is_active" name="is_active" checked>
                <label class="form-check-label fw-bold" for="id_tier_is_active">{% trans "تفعيل الشريحة التجارية" %}</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-primary px-4 fw-bold" id="btnSaveTier">
            <i class="fas fa-save me-1"></i>{% trans "حفظ الشريحة" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
