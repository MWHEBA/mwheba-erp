{% load i18n %}

<div class="modal fade" id="deletePaymentTermModal" tabindex="-1" aria-labelledby="deletePaymentTermModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-light border-bottom px-4 py-3">
        <h5 class="modal-title fw-bold text-danger mb-0" id="deletePaymentTermModalLabel">
          <i class="fas fa-exclamation-triangle text-danger me-2"></i>{% trans "تأكيد حذف شرط السداد" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="deletePaymentTermForm" method="POST" action="">
        {% csrf_token %}
        <div class="modal-body p-4">
          <p class="mb-3">
            {% trans "هل أنت متأكد من رغبتك في حذف شرط السداد:" %} <strong id="deletePaymentTermName" class="text-danger"></strong>؟
          </p>
          <div class="alert alert-warning mb-0 small">
            <i class="fas fa-info-circle me-1"></i>
            {% trans "سيتم فك ارتباط العملاء والشرائح المسندة لهذا الشرط ليصبحوا بدون شرط افتراضي." %}
          </div>
        </div>
        <div class="modal-footer bg-light border-top px-4 py-3">
          <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">{% trans "إلغاء" %}</button>
          <button type="submit" class="btn btn-danger px-4 fw-bold">
            <i class="fas fa-trash-alt me-1"></i>{% trans "تأكيد الحذف" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
